<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STARK INTERFACE - MK III</title>
    <style>
        /* --- STARK OS STYLING --- */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        body { 
            margin: 0; overflow: hidden; background-color: #020205; 
            font-family: 'Rajdhani', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 50%, #051020 0%, #000 100%);
        }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            box-sizing: border-box; padding: 20px;
            background: 
                linear-gradient(rgba(0, 170, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 170, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .widget {
            position: absolute; border: 1px solid rgba(0, 170, 255, 0.3);
            background: rgba(0, 20, 40, 0.4);
            backdrop-filter: blur(2px);
            color: #00aaff; padding: 10px;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.1);
        }
        .widget h3 { margin: 0 0 5px 0; font-size: 14px; letter-spacing: 2px; border-bottom: 1px solid #00aaff; }
        .widget p { font-size: 10px; line-height: 1.4; opacity: 0.8; margin: 0; font-family: monospace; }
        
        .widget::before, .widget::after {
            content: ''; position: absolute; width: 6px; height: 6px;
            border: 2px solid #fff; transition: all 0.2s;
        }
        .widget::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .widget::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        #widget-left { top: 10%; left: 5%; width: 200px; height: 150px; }
        #widget-right { top: 20%; right: 5%; width: 220px; height: 280px; }

        #widget-bottom { 
            bottom: 30px; left: 50%; transform: translateX(-50%); 
            width: 400px; text-align: center; border: none; background: transparent; 
        }

        #reticle {
            position: absolute; width: 80px; height: 80px;
            border: 1px dashed rgba(0, 255, 255, 0.6); border-radius: 50%;
            transform: translate(-50%, -50%); display: none;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            transition: width 0.1s, height 0.1s;
        }
        #reticle.locked {
            border: 2px solid #fff; width: 60px; height: 60px;
            box-shadow: 0 0 30px #00aaff; background: rgba(0, 170, 255, 0.1);
        }

        .highlight { color: #fff; text-shadow: 0 0 5px #fff; }

        #cam-feed {
            position: absolute; bottom: 20px; left: 20px;
            width: 140px; opacity: 0.4; border: 1px solid #00aaff;
            transform: scaleX(-1);
        }

        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; color: #00aaff;
        }
    </style>
</head>
<body>

    <div id="loader">
        <h2 style="letter-spacing: 5px;">J.A.R.V.I.S.</h2>
        <p>LOADING GEOMETRIC ARRAYS...</p>
    </div>

    <div id="ui-layer">
        <div id="widget-left" class="widget">
            <h3>GLOBAL_SCAN</h3>
            <p>SECTOR: 7G <span style="float:right">ACTIVE</span></p>
            <p>LAT: 34.0522 N</p>
            <p>LON: 118.2437 W</p>
            <br>
            <div style="width:100%; height:2px; background:#005577;">
                <div style="width:60%; height:100%; background:#00aaff;"></div>
            </div>
            <p style="margin-top:5px;">UPLINK: STABLE</p>
        </div>

        <div id="widget-right" class="widget">
            <h3>ELEMENT_ANALYSIS</h3>
            <p>TYPE: VIBRANIUM SYNTHETIC</p>
            <p>ATOMIC WEIGHT: 245.21</p>
            <br>
            <p>SIMULATION:</p>
            <p class="highlight">> CORE STABLE</p>
            <p class="highlight">> FIELD CONFINED</p>
            <br>
            <p style="color:#00aaff; text-align:right;">[RENDER_3D]</p>
        </div>

        <div id="widget-bottom">
            <h2 id="main-status" style="margin:0; font-weight:300; letter-spacing:3px;">SYSTEM IDLE</h2>
            <small id="sub-status" style="color:#005577;">WAITING FOR BIOMETRIC INPUT</small>
        </div>

        <div id="reticle"></div>
    </div>
    
    <video id="cam-feed" autoplay playsinline muted></video>

    <script type="x-shader/x-vertex" id="v-particle">
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        void main() {
            vColor = customColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>
    <script type="x-shader/x-fragment" id="f-particle">
        uniform vec3 color;
        varying vec3 vColor;
        void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0;
            float r = dot(cxy, cxy);
            if (r > 1.0) discard;
            float alpha = (1.0 - r) * 0.8; 
            gl_FragColor = vec4(color * vColor, alpha);
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        const CONFIG = {
            sensitivity: 6.5,      
            zoomSensitivity: 5.0,  
            friction: 0.94,        
            glowColor: 0x00aaff,   
            coreColor: 0xffffff    
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.0015);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 120;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const holoGroup = new THREE.Group();
        scene.add(holoGroup);

        // --- 1. THE CORE SPHERE (Same as before) ---
        const globeGeo = new THREE.IcosahedronGeometry(40, 2); 
        const globeMat = new THREE.MeshBasicMaterial({ color: 0x005577, wireframe: true, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
        const globe = new THREE.Mesh(globeGeo, globeMat);
        holoGroup.add(globe);

        const pCount = 8000;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        const pCol = new Float32Array(pCount * 3);
        const pSize = new Float32Array(pCount);
        const cBlue = new THREE.Color(CONFIG.glowColor);
        const cWhite = new THREE.Color(CONFIG.coreColor);

        for(let i=0; i<pCount; i++) {
            const r = 38 * Math.cbrt(Math.random());
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            pPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            pPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            pPos[i*3+2] = r * Math.cos(phi);
            const color = r < 15 ? cWhite : cBlue;
            pCol[i*3] = color.r; pCol[i*3+1] = color.g; pCol[i*3+2] = color.b;
            pSize[i] = r < 15 ? 1.5 : 0.8;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('customColor', new THREE.BufferAttribute(pCol, 3));
        pGeo.setAttribute('size', new THREE.BufferAttribute(pSize, 1));
        const pMat = new THREE.ShaderMaterial({
            uniforms: { color: { value: new THREE.Color(0xffffff) } },
            vertexShader: document.getElementById('v-particle').textContent,
            fragmentShader: document.getElementById('f-particle').textContent,
            blending: THREE.AdditiveBlending, depthTest: false, transparent: true
        });
        const particles = new THREE.Points(pGeo, pMat);
        holoGroup.add(particles);


        // --- 2. UPGRADED RINGS (The Cool Part) ---
        
        // A. THE "TICKER" RING (Small dash marks)
        // Creates a ring of 180 small lines
        const tickGeo = new THREE.BufferGeometry();
        const tickPos = [];
        const tickRad = 55;
        for(let i=0; i<180; i++) {
            const angle = (i / 180) * Math.PI * 2;
            const x1 = Math.cos(angle) * tickRad;
            const y1 = Math.sin(angle) * tickRad;
            const x2 = Math.cos(angle) * (tickRad + 2); // Length of tick
            const y2 = Math.sin(angle) * (tickRad + 2);
            tickPos.push(x1, y1, 0);
            tickPos.push(x2, y2, 0);
        }
        tickGeo.setAttribute('position', new THREE.Float32BufferAttribute(tickPos, 3));
        const tickMat = new THREE.LineBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.5 });
        const tickerRing = new THREE.LineSegments(tickGeo, tickMat);
        holoGroup.add(tickerRing);

        // B. THE "ARC" SHIELD (Thick curved segments)
        const arcGroup = new THREE.Group();
        const arcGeo = new THREE.RingGeometry(65, 70, 64, 1, 0, Math.PI / 2); // Quarter circle
        const arcMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending });
        
        const arc1 = new THREE.Mesh(arcGeo, arcMat);
        const arc2 = new THREE.Mesh(arcGeo, arcMat);
        arc2.rotation.z = Math.PI; // Opposite side
        
        arcGroup.add(arc1);
        arcGroup.add(arc2);
        holoGroup.add(arcGroup);

        // C. THE "GYRO" RINGS (Thin laser lines)
        const gyroGeo = new THREE.TorusGeometry(80, 0.1, 4, 100); // Very thin
        const gyroMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
        const gyro1 = new THREE.Mesh(gyroGeo, gyroMat);
        const gyro2 = new THREE.Mesh(gyroGeo, gyroMat);
        gyro2.rotation.x = Math.PI / 2.5; // Tilted
        gyro2.scale.set(0.9, 0.9, 0.9);

        holoGroup.add(gyro1);
        holoGroup.add(gyro2);


        // --- 3. PHYSICS & ANIMATION ---
        let state = {
            locked: false,
            handX: 0, handY: 0,
            prevX: 0, prevY: 0,
            scaleTarget: 1.0,
            rotVelX: 0.001, rotVelY: 0.002
        };

        const reticle = document.getElementById('reticle');
        const statusMain = document.getElementById('main-status');
        const statusSub = document.getElementById('sub-status');

        function updatePhysics() {
            if (state.locked) {
                const deltaX = state.handX - state.prevX;
                const deltaY = state.handY - state.prevY;
                
                holoGroup.rotation.y += deltaX * CONFIG.sensitivity;
                holoGroup.rotation.x -= deltaY * CONFIG.sensitivity; 

                holoGroup.position.x += (state.handX * 80 - holoGroup.position.x) * 0.1;
                holoGroup.position.y += (state.handY * 80 - holoGroup.position.y) * 0.1;

                state.rotVelY = deltaX * 0.5;
                state.rotVelX = -deltaY * 0.5;
            } else {
                holoGroup.rotation.y += state.rotVelY;
                holoGroup.rotation.x += state.rotVelX;
                state.rotVelY *= CONFIG.friction;
                state.rotVelX *= CONFIG.friction;
                holoGroup.position.x *= 0.95;
                holoGroup.position.y *= 0.95;
            }

            const s = holoGroup.scale.x;
            const newS = s + (state.scaleTarget - s) * 0.1;
            holoGroup.scale.set(newS, newS, newS);

            // --- ANIMATE THE NEW RINGS ---
            tickerRing.rotation.z -= 0.005; // Slow counter-rotate
            arcGroup.rotation.z += 0.01;    // Medium rotate
            gyro1.rotation.x += 0.02;       // Fast gyro spin
            gyro1.rotation.y += 0.01;
            gyro2.rotation.y -= 0.02;

            state.prevX = state.handX;
            state.prevY = state.handY;
        }

        // --- 4. COMPUTER VISION ---
        function onResults(results) {
            if (results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                
                const rawX = 1.0 - hand[9].x; 
                const rawY = 1.0 - hand[9].y; 
                
                state.handX = (rawX - 0.5) * 2; 
                state.handY = (rawY - 0.5) * 2;

                reticle.style.display = 'block';
                reticle.style.left = rawX * 100 + '%';
                reticle.style.top = (1.0 - rawY) * 100 + '%';

                const tips = [8, 12, 16, 20];
                const pips = [6, 10, 14, 18];
                let folded = 0;
                for(let i=0; i<4; i++) {
                    const dTip = Math.hypot(hand[tips[i]].x - hand[0].x, hand[tips[i]].y - hand[0].y);
                    const dPip = Math.hypot(hand[pips[i]].x - hand[0].x, hand[pips[i]].y - hand[0].y);
                    if(dTip < dPip) folded++;
                }

                if (folded >= 3) {
                    if(!state.locked) {
                        reticle.classList.add('locked');
                        statusMain.innerText = "MANIPULATION MODE";
                        statusMain.classList.add('highlight');
                        statusSub.innerText = "GESTURE LOCK: ACTIVE";
                    }
                    state.locked = true;
                } else {
                    if(state.locked) {
                        reticle.classList.remove('locked');
                        statusMain.innerText = "SCANNING...";
                        statusMain.classList.remove('highlight');
                        statusSub.innerText = "HOVER TO INTERACT";
                    }
                    state.locked = false;
                }

                if (results.multiHandLandmarks.length === 2) {
                    const h2 = results.multiHandLandmarks[1];
                    const dist = Math.hypot(hand[9].x - h2[9].x, hand[9].y - h2[9].y);
                    state.scaleTarget = 0.5 + (dist * CONFIG.zoomSensitivity);
                    statusSub.innerText = "EXPANDING VIEWPORT";
                } else {
                    state.scaleTarget = 1.0;
                }

            } else {
                reticle.style.display = 'none';
                state.locked = false;
                statusMain.innerText = "SYSTEM IDLE";
                statusSub.innerText = "WAITING FOR INPUT";
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        const cameraUtils = new Camera(document.getElementById('cam-feed'), {
            onFrame: async () => { await hands.send({image: document.getElementById('cam-feed')}); },
            width: 640, height: 360
        });
        cameraUtils.start().then(() => document.getElementById('loader').style.display = 'none');

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            particles.material.uniforms.color.value.setHSL(0.55, 1.0, 0.5 + Math.sin(Date.now()*0.002)*0.1);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
